<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Lambfield</title>
    <link rel="icon" href="img/favIcon.png">

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="headerWrapper">
        <img id="outsideCloud" src="img/cloud.png" alt="Cloud1">

        <header>
            <div id="banner">
                <img id="middleTowers" src="img/mid.png" alt="middleTowers">
                <img id="dynamicLines" src="img/dynamicLines.png" alt="dynamicLines">
                <img id="cloudBanner" src="img/cloud.png" alt="Cloud2">
            </div>
            <img src="img/front.png" alt="frontTowers">

            <div id="burgerMenu">
                <img src="img/burguerTop.png" alt="burguerTop">
                <img src="img/burguerMiddle.png" alt="burguerMiddle">
                <img src="img/burguerBottom.png" alt="burguerBottom">
            </div>
        </header>
    </div>

    <img id="NewLambfield" class="hover1" src="img/logo.png" alt="NewLambfield_Logo">

    <main>
        <aside>
            <div class="scrollableContent">
                <figure>
                    <img id="marker" src="img/marker_0.png" alt="marker0">
                </figure>
                
                <nav>
                    <a class="button sel" href="index.html"> <img src="img/marker_1.png" alt="marker_1"> </a>
                    <a class="button" href="about.html"> <img src="img/marker_2.png" alt="marker_2"> </a>
                    <a class="button" href="contact.html"> <img src="img/marker_3.png" alt="marker_3"> </a>
                </nav>
            </div>
        </aside>

        <template id="post-template">
            <a href="">
                <div class="postWidget">
                    <img src="" alt="">
                    
                    <div class="postWidgetText">
                        <h2></h2>
                        <div class="date"></div>
                        <p></p>
                    </div>
                </div>
            </a>
        </template>

        <article>
            <script src="js/postInstancer.js"></script>
        </article>
    </main>

    <script src="js/burger.js"></script>
</body>
</html>
